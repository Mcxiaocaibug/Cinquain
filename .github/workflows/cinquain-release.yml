name: Publish Cinquain

on:
  push:
    tags: ["cinquain-v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: cinquain-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    name: Publish signed multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Verify release tag and product version
        shell: bash
        run: |
          expected="cinquain-v$(cat cinquain/VERSION)"
          test "$GITHUB_REF_NAME" = "$expected"
          ./cinquain/preflight.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mcxiaocaibug/cinquain
          tags: |
            type=match,pattern=cinquain-v(.*),group=1
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=cinquain-linux/amd64
            type=gha,scope=cinquain-linux/arm64
            type=gha,scope=cinquain-release
          cache-to: type=gha,mode=max,scope=cinquain-release
          build-args: |
            CONTINUWUITY_VERSION_EXTRA=+cinquain.${{ github.ref_name }}
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_COMMIT_HASH_SHORT=${{ github.sha }}
            GIT_REMOTE_URL=https://github.com/${{ github.repository }}
            GIT_REMOTE_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            test -z "$tag" || cosign sign --yes "$tag@$DIGEST"
          done <<< "$TAGS"

      - name: Create GitHub provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mcxiaocaibug/cinquain
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish release bundle
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Build deployment bundle
        shell: bash
        run: |
          version=$(cat cinquain/VERSION)
          tar czf "cinquain-$version.tar.gz" cinquain
          sha256sum "cinquain-$version.tar.gz" > "cinquain-$version.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Cinquain ${{ github.ref_name }}
          body_path: cinquain/CHANGELOG.md
          generate_release_notes: true
          make_latest: true
          files: |
            cinquain-*.tar.gz
            cinquain-*.tar.gz.sha256
