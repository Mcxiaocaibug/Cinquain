name: ${CINQUAIN_STACK_NAME:-cinquain}

services:
  homeserver:
    image: ${CINQUAIN_HOMESERVER_IMAGE:-ghcr.io/mcxiaocaibug/cinquain:0.0.2}
    pull_policy: missing
    command: /sbin/conduwuit
    restart: unless-stopped
    init: true
    environment:
      CONTINUWUITY_CONFIG: /etc/continuwuity/continuwuity.toml
      RUST_LOG: ${CINQUAIN_LOG_LEVEL:-info}
      TZ: ${CINQUAIN_TIMEZONE:-UTC}
    volumes:
      - homeserver_data:/var/lib/continuwuity
      - ./continuwuity.toml:/etc/continuwuity/continuwuity.toml:ro
      - ./continuwuity-resolv.conf:/etc/resolv.conf:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: ${CINQUAIN_CADDY_IMAGE:-docker.io/caddy:2.11.4-alpine}
    pull_policy: missing
    restart: unless-stopped
    init: true
    environment:
      CINQUAIN_SERVER_NAME: ${CINQUAIN_SERVER_NAME:?CINQUAIN_SERVER_NAME is required}
      CINQUAIN_OPERATOR_EMAIL: ${CINQUAIN_OPERATOR_EMAIL:?CINQUAIN_OPERATOR_EMAIL is required}
    ports:
      - "${CINQUAIN_HTTP_PORT:-80}:80"
      - "${CINQUAIN_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    depends_on:
      - homeserver
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  edge:
  backend:
    internal: true

volumes:
  homeserver_data:
  caddy_data:
  caddy_config:
